name: Cuadra
options:
  bundleIdPrefix: cl.cuadra
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: es
  createIntermediateGroups: true
packages:
  CuadraCore:
    path: CuadraCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Cuadra:
    type: application
    platform: iOS
    sources:
      - path: Cuadra
    dependencies:
      - package: CuadraCore
    info:
      path: Cuadra/Info.plist
      properties:
        CFBundleDisplayName: Cuadra
        CFBundleDevelopmentRegion: es
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        NSFaceIDUsageDescription: Cuadra usa Face ID para proteger tu información financiera.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cl.cuadra.app
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
schemes:
  Cuadra:
    build:
      targets:
        Cuadra: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: CuadraCore/CuadraCoreTests
